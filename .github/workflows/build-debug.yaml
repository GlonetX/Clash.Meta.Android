name: Build Debug
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  # UI-only guard for the overhaul phase branches: core/ and the service
  # runtime are frozen (see OVERHAUL_WORKTREES.md). Additive store keys are
  # the sole exception. Also blocks secret-class files, which this repo has
  # leaked before (id_ed25519 + release.keystore, removed in 81056b19).
  ScopeGuard:
    if: startsWith(github.head_ref, 'feature/phase-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Enforce frozen layers and scan for secrets
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          CHANGED=$(git diff --name-only --diff-filter=ACMRD "$BASE" "$HEAD")
          echo "Changed files:"
          echo "$CHANGED"

          VIOLATIONS=$(echo "$CHANGED" | grep -E '^core/|^service/' | grep -v 'store/' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Frozen layer touched (UI-only rule, see OVERHAUL_WORKTREES.md):"
            echo "$VIOLATIONS"
            exit 1
          fi

          SECRETS=$(echo "$CHANGED" | grep -E '(^|/)(id_rsa|id_ed25519|.*\.keystore|.*\.jks|.*\.pem|.*\.p12)$' || true)
          if [ -n "$SECRETS" ]; then
            echo "::error::Secret-class file added:"
            echo "$SECRETS"
            exit 1
          fi

          echo "Scope OK: UI-only, no secrets."

  BuildDebug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Checkout deploy key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          touch id_ed25519
          echo "$DEPLOY_KEY" > id_ed25519
          chmod 600 ./id_ed25519

      - name: Checkout submodules
        run: |
          eval "$(ssh-agent -s)"
          ssh-add ./id_ed25519
          git submodule update --init --recursive --force

      - name: Restore signing keystore
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE" | base64 --decode > release.keystore

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.27.3'

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Build
        if: success()
        run: ./gradlew --no-daemon app:assembleAlphaRelease

      - name: Upload Aritfact (universal)
        uses: actions/upload-artifact@v7
        if: ${{  success() }}
        with:
          name: CMFA Debug Unsigned APK (universal)
          path: |
            app/build/outputs/apk/alpha/release/*-universal-*.apk

      - name: Upload Aritfact (arm64-v8a)
        uses: actions/upload-artifact@v7
        if: ${{  success() }}
        with:
          name: CMFA Debug Unsigned APK (arm64-v8a)
          path: |
            app/build/outputs/apk/alpha/release/*-arm64-v8a-*.apk

      - name: Upload Aritfact (armeabi-v7a)
        uses: actions/upload-artifact@v7
        if: ${{  success() }}
        with:
          name: CMFA Debug Unsigned APK (armeabi-v7a)
          path: |
            app/build/outputs/apk/alpha/release/*-armeabi-v7a-*.apk

      - name: Upload Aritfact (x86_64)
        uses: actions/upload-artifact@v7
        if: ${{  success() }}
        with:
          name: CMFA Debug Unsigned APK (x86_64)
          path: |
            app/build/outputs/apk/alpha/release/*-x86_64-*.apk

      - name: Upload Aritfact (x86)
        uses: actions/upload-artifact@v7
        if: ${{  success() }}
        with:
          name: CMFA Debug Unsigned APK (x86)
          path: |
            app/build/outputs/apk/alpha/release/*-x86-*.apk
