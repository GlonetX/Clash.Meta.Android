name: Build Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release Tag (v12.x.x)'
        required: true

jobs:
  BuildRelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout deploy key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          touch id_ed25519
          echo "$DEPLOY_KEY" > id_ed25519
          chmod 600 ./id_ed25519

      - name: Checkout submodules
        run: |
          eval "$(ssh-agent -s)"
          ssh-add ./id_ed25519
          git submodule update --init --recursive --force

      - name: Restore signing keystore
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE" | base64 --decode > release.keystore

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.27.3'

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Convert and set version env
        id: process-version
        run: |
          VERSION_TAG=${{ inputs.release-tag }}
          VERSION_TAG=${VERSION_TAG#v}                              # remove the 'v' prefix
          IFS='.' read -ra VERSION_PARTS <<< "$VERSION_TAG"         # split into array
          ITERATION=${VERSION_PARTS[3]:-01}                          # our own iteration (4th segment, default 01)
          VERSION_CODE=$(printf "%1d%02d%03d%02d" "${VERSION_PARTS[0]}" "${VERSION_PARTS[1]}" "${VERSION_PARTS[2]}" "${ITERATION}")

          echo "versonName=$VERSION_TAG" >> $GITHUB_OUTPUT          # "1.2.3"
          echo "versonCode=$VERSION_CODE" >> $GITHUB_OUTPUT         # "102003"

      # Re-write version in build.gradle.kts
      - name: Re-write version
        uses: Devofure/advance-android-version-actions@v1.5
        with:
          gradlePath: build.gradle.kts
          versionCode: ${{ steps.process-version.outputs.versonCode }}
          versionName: ${{ steps.process-version.outputs.versonName }}

      # If any change found, commit it and push it
      - name: Commit and push if changes
        run: |
          changes=$(git diff --name-only origin/main | wc -l)
          if [ $changes -gt 0 ]
          then
            newVersionName=${{ steps.process-version.outputs.versonName }}
            newVersionCode=${{ steps.process-version.outputs.versonCode }}
            git config --global user.name 'GitHub Action'
            git config --global user.email 'action@github.com'
            git add build.gradle.kts
            git commit -am "Bump version to $newVersionName ($newVersionCode)"
            git tag "v$newVersionName"
            git push --follow-tags
          fi

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Signing properties
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          touch signing.properties
          echo keystore.password="$SIGNING_STORE_PASSWORD" > signing.properties
          echo key.alias="$SIGNING_KEY_ALIAS" >> signing.properties
          echo key.password="$SIGNING_KEY_PASSWORD" >> signing.properties

      - name: Release Build
        if: success()
        run: ./gradlew --no-daemon app:assembleMetaRelease

      # One `<apk>.sha256` file next to each APK, in `sha256sum` format.
      # The in-app updater downloads the matching file and refuses to
      # install an APK whose digest does not match.
      - name: Generate APK checksums
        if: success()
        run: |
          cd app/build/outputs/apk/meta/release
          for apk in *.apk; do
            sha256sum "$apk" > "$apk.sha256"
          done

      - name: Tag Repo
        uses: richardsimko/update-tag@v3
        with:
          tag_name: ${{ inputs.release-tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        if: ${{ success() }}
        with:
          tag_name: ${{ inputs.release-tag }}
          files: app/build/outputs/apk/meta/release/*
          generate_release_notes: true
